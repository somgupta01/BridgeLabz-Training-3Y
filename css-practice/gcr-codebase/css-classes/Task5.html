
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Styled Button Collection</title>
    <link rel="stylesheet" href="Task5.css">
</head>
<body>
    <header>
        <h1>Button Styles</h1>
        <p>Hover, press, or focus on the buttons to see their effects.</p>
    </header>

    <main class="button-container">
        <section class="button-example">
            <button class="btn primary" type="button">Primary</button>
            <p>Main action button</p>
        </section>

        <section class="button-example">
            <button class="btn secondary" type="button">Secondary</button>
            <p>Alternative action button</p>
        </section>

        <section class="button-example">
            <button class="btn outline" type="button">Outline</button>
            <p>Button with transparent background</p>
        </section>

        <section class="button-example">
            <button class="btn disabled" type="button" disabled>Disabled</button>
            <p>Button that cannot be clicked</p>
        </section>
    </main>

    <footer>CSS Button Styling Practice</footer>
</body>
</html>
