
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Image Showcase</title>
    <link rel="stylesheet" href="Task3.css">
</head>
<body>
    <header>
        <h1>Beautiful Places</h1>
        <p>Explore our image gallery.</p>
    </header>

    <main class="gallery">
        <figure class="gallery-item">
            <div class="image-wrapper">
                <img src="https://images.unsplash.com/photo-1500530855697-b586d89ba3ee?auto=format&fit=crop&w=700&q=80" alt="Mountain landscape">
            </div>
            <figcaption>Mountain Escape</figcaption>
        </figure>

        <figure class="gallery-item">
            <div class="image-wrapper">
                <img src="https://images.unsplash.com/photo-1507525428034-b723cf961d3e?auto=format&fit=crop&w=700&q=80" alt="Sunny beach">
            </div>
            <figcaption>Tropical Beach</figcaption>
        </figure>

        <figure class="gallery-item">
            <div class="image-wrapper">
                <img src="https://images.unsplash.com/photo-1511818966892-d7d671e672a2?auto=format&fit=crop&w=700&q=80" alt="Modern architecture">
            </div>
            <figcaption>Modern Architecture</figcaption>
        </figure>

        <figure class="gallery-item">
            <div class="image-wrapper">
                <img src="https://images.unsplash.com/photo-1470770841072-f978cf4d019e?auto=format&fit=crop&w=700&q=80" alt="Lake surrounded by mountains">
            </div>
            <figcaption>Peaceful Lake</figcaption>
        </figure>

        <figure class="gallery-item">
            <div class="image-wrapper">
                <img src="https://images.unsplash.com/photo-1441974231531-c6227db76b6e?auto=format&fit=crop&w=700&q=80" alt="Green forest">
            </div>
            <figcaption>Green Forest</figcaption>
        </figure>

        <figure class="gallery-item">
            <div class="image-wrapper">
                <img src="https://images.unsplash.com/photo-1464822759023-fed622ff2c3b?auto=format&fit=crop&w=700&q=80" alt="Snow-covered mountains">
            </div>
            <figcaption>Snowy Peaks</figcaption>
        </figure>
    </main>

    <footer>Image Showcase Gallery</footer>
</body>
</html>
