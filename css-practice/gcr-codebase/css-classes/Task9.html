
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Combined CSS Effects</title>
    <link rel="stylesheet" href="Task9.css">
</head>
<body>
    <header>
        <h1>Combined CSS Effects</h1>
        <p>Hover over the cards and buttons to see the effects.</p>
    </header>

    <main class="effects-container">
        <section class="effect-card">
            <h2>Primary Effect</h2>
            <p>Color change, scaling, and shadow.</p>
            <button class="effect-btn primary" type="button">Explore</button>
        </section>

        <section class="effect-card">
            <h2>Secondary Effect</h2>
            <p>Background change and movement.</p>
            <button class="effect-btn secondary" type="button">Discover</button>
        </section>

        <section class="effect-card">
            <h2>Outline Effect</h2>
            <p>Border and color transitions.</p>
            <button class="effect-btn outline" type="button">Learn More</button>
        </section>
    </main>

    <footer>Combined CSS Effects Practice</footer>
</body>
</html>
