
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>TechStore Products</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="Task3.css">
</head>
<body>
  <header class="bg-dark text-white p-3">
    <div class="container d-flex justify-content-between align-items-center">
      <h2 class="mb-0">TechStore</h2>
      <span>Online Shopping</span>
    </div>
  </header>

  <main class="container py-5">
    <h1 class="text-center fw-bold mb-2">Our Products</h1>
    <p class="text-center text-secondary mb-5">Discover our latest technology products.</p>

    <div class="row g-4">
      <!-- col-12 = 1 mobile column, col-sm-6 = 2, col-md-3 = 4 -->
      <div class="col-12 col-sm-6 col-md-3">
        <article class="card product-card h-100 shadow-sm">
          <img src="https://placehold.co/400x250/e0f2fe/1e40af?text=Headphones" class="card-img-top" alt="Headphones">
          <div class="card-body">
            <h5 class="card-title">Wireless Headphones</h5>
            <p class="price fw-bold">₹1,499</p>
            <button class="btn btn-primary w-100">Add to Cart</button>
          </div>
        </article>
      </div>

      <div class="col-12 col-sm-6 col-md-3">
        <article class="card product-card h-100 shadow-sm">
          <img src="https://placehold.co/400x250/dcfce7/166534?text=Smartwatch" class="card-img-top" alt="Smartwatch">
          <div class="card-body">
            <h5 class="card-title">Smart Watch</h5>
            <p class="price fw-bold">₹2,499</p>
            <button class="btn btn-primary w-100">Add to Cart</button>
          </div>
        </article>
      </div>

      <div class="col-12 col-sm-6 col-md-3">
        <article class="card product-card h-100 shadow-sm">
          <img src="https://placehold.co/400x250/fef3c7/92400e?text=Keyboard" class="card-img-top" alt="Keyboard">
          <div class="card-body">
            <h5 class="card-title">Mechanical Keyboard</h5>
            <p class="price fw-bold">₹1,999</p>
            <button class="btn btn-primary w-100">Add to Cart</button>
          </div>
        </article>
      </div>

      <div class="col-12 col-sm-6 col-md-3">
        <article class="card product-card h-100 shadow-sm">
          <img src="https://placehold.co/400x250/fce7f3/9d174d?text=Speaker" class="card-img-top" alt="Bluetooth speaker">
          <div class="card-body">
            <h5 class="card-title">Bluetooth Speaker</h5>
            <p class="price fw-bold">₹999</p>
            <button class="btn btn-primary w-100">Add to Cart</button>
          </div>
        </article>
      </div>
    </div>
  </main>

  <footer class="bg-dark text-white text-center p-3">
    © 2026 TechStore
  </footer>
</body>
</html>
