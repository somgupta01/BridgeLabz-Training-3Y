
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>My Portfolio</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="Task2.css">
</head>
<body class="bg-light text-dark">
  <header class="text-center bg-white p-5">
    <div class="container">
      <h1 class="fw-bold">Som Gupta</h1>
      <p class="lead">Computer Science Student | Aspiring Developer</p>
    </div>
  </header>

  <main class="container my-5">
    <section class="profile text-center p-5 rounded shadow-sm">
      <img src="https://placehold.co/180x180/0d6efd/ffffff?text=Profile"
           class="img-fluid rounded-circle profile-img mb-4"
           alt="Profile photo">
      <h2 class="fw-bold">Hello, I'm Som!</h2>
      <p class="mt-3 mb-4">I enjoy building websites and learning new technologies.</p>
      <a href="#contact" class="btn btn-primary me-2">Hire Me</a>
      <a href="cv.pdf" class="btn btn-outline-dark">Download CV</a>
    </section>

    <section id="contact" class="container mt-5">
      <h2 class="text-center mb-4">Contact Me</h2>
      <form class="mx-auto contact-form">
        <input type="text" class="form-control mb-3" placeholder="Your Name" required>
        <input type="email" class="form-control mb-3" placeholder="Your Email" required>
        <textarea class="form-control mb-3" rows="4" placeholder="Your Message" required></textarea>
        <button type="submit" class="btn btn-primary w-100">Send Message</button>
      </form>
    </section>
  </main>

  <footer class="text-center bg-dark text-white p-3 mt-5">
    © 2026 Som Gupta | My Portfolio
  </footer>
</body>
</html>
