
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CSS Transformations</title>
    <link rel="stylesheet" href="Task6.css">
</head>
<body>
    <header>
        <h1>CSS Transformations</h1>
        <p>Hover over each box to see the transformation.</p>
    </header>

    <main class="transform-container">
        <section class="item">
            <div class="box rotate">Rotate</div>
            <p>rotate(15deg)</p>
        </section>

        <section class="item">
            <div class="box scale">Scale</div>
            <p>scale(1.2)</p>
        </section>

        <section class="item">
            <div class="box translate">Translate</div>
            <p>translate(15px, -10px)</p>
        </section>

        <section class="item">
            <div class="box skew">Skew</div>
            <p>skew(10deg)</p>
        </section>
    </main>
</body>
</html>
