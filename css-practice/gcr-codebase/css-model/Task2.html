
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Height and Width Practice</title>
    <link rel="stylesheet" href="Task2.css">
</head>
<body>
    <header>
        <h1>Height and Width Practice</h1>
    </header>

    <main class="container">
        <section class="box box-one">
            <h2>Box One</h2>
            <p>Width: 200px</p>
            <p>Height: 150px</p>
        </section>

        <section class="box box-two">
            <h2>Box Two</h2>
            <p>Width: 40%</p>
            <p>Height: 25vh</p>
        </section>

        <section class="box box-three">
            <h2>Box Three</h2>
            <p>Width: 15em</p>
            <p>Overflow demonstration</p>
            <p>This extra text shows how overflow is handled inside a fixed-height box.</p>
        </section>
    </main>

    <footer>Practice CSS sizing units</footer>
</body>
</html>
