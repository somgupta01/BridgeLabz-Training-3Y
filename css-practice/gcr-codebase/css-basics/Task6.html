
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Photo Gallery</title>
    <link rel="stylesheet" href="Task6.css">
</head>
<body>
    <header>
        <h1>My Photo Gallery</h1>
        <p>Explore beautiful places around the world.</p>
    </header>

    <main class="gallery">
        <figure class="photo">
            <img src="https://placehold.co/400x300?text=Mountains" alt="Mountains">
            <figcaption>Beautiful Mountains</figcaption>
        </figure>

        <figure class="photo">
            <img src="https://placehold.co/400x300?text=Beach" alt="Beach">
            <figcaption>Peaceful Beach</figcaption>
        </figure>

        <figure class="photo">
            <img src="https://placehold.co/400x300?text=Forest" alt="Forest">
            <figcaption>Green Forest</figcaption>
        </figure>

        <figure class="photo">
            <img src="https://placehold.co/400x300?text=City" alt="City">
            <figcaption>Modern City</figcaption>
        </figure>

        <figure class="photo">
            <img src="https://placehold.co/400x300?text=Desert" alt="Desert">
            <figcaption>Golden Desert</figcaption>
        </figure>

        <figure class="photo">
            <img src="https://placehold.co/400x300?text=Waterfall" alt="Waterfall">
            <figcaption>Beautiful Waterfall</figcaption>
        </figure>
    </main>

    <footer>
        <p>&copy; 2026 My Photo Gallery</p>
    </footer>
</body>
</html>
