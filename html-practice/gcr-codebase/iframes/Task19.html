
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Form Security</title>
</head>
<body>
    <h1>Secure Information Form</h1>

    <form action="#" method="post" autocomplete="off">
        <p>
            <label for="username">Username:</label>
            <input type="text" id="username" name="username" required>
        </p>

        <p>
            <label for="email">Email:</label>
            <input type="email" id="email" name="email" required>
        </p>

        <p>
            <label for="password">Password:</label>
            <input type="password" id="password" name="password" required>
        </p>

        <button type="submit">Submit</button>
    </form>

    <p>
        Note: The autocomplete="off" attribute asks the browser
        not to automatically fill or save form information.
        This may help reduce exposure on shared devices, but
        it does not guarantee security.
    </p>
</body>
</html>
