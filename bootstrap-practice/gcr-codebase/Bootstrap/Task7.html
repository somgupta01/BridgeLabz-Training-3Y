
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Task Tracker</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="Task7.css">
</head>
<body>
  <header class="tracker-header text-white py-4">
    <div class="container d-flex justify-content-between align-items-center flex-wrap gap-2">
      <h1 class="h2 mb-0">My Task Tracker</h1>
      <span class="badge bg-warning text-dark fs-6">
        Pending <span class="badge bg-dark">4</span>
      </span>
    </div>
  </header>

  <main class="container py-5">
    <section class="task-panel mx-auto">
      <h2 class="mb-4">Today's Tasks</h2>

      <!-- Bootstrap list group displays the tasks -->
      <ul class="list-group shadow-sm">
        <li class="list-group-item d-flex justify-content-between align-items-center flex-wrap gap-2">
          <span>Complete Bootstrap Assignment</span>
          <span class="badge bg-danger">High</span>
        </li>
        <li class="list-group-item d-flex justify-content-between align-items-center flex-wrap gap-2">
          <span>Practice Java DSA</span>
          <span class="badge bg-warning text-dark">Medium</span>
        </li>
        <li class="list-group-item d-flex justify-content-between align-items-center flex-wrap gap-2">
          <span>Revise SQL Queries</span>
          <span class="badge bg-success">Low</span>
        </li>
        <li class="list-group-item d-flex justify-content-between align-items-center flex-wrap gap-2">
          <span>Update Project Documentation</span>
          <span class="badge bg-danger">High</span>
        </li>
      </ul>

      <section class="completed-box mt-4 p-4 text-center rounded">
        <h3 class="h5">Completed Tasks</h3>
        <p>You have successfully completed 3 tasks.</p>
        <button class="btn btn-success">
          Completed <span class="badge bg-light text-success">3</span>
        </button>
      </section>
    </section>
  </main>

  <footer class="text-center text-secondary p-3">
    © 2026 My Task Tracker
  </footer>
</body>
</html>
