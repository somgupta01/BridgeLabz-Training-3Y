
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Grid Dashboard</title>
    <link rel="stylesheet" href="Task4.css">
</head>
<body>
    <div class="dashboard">
        <header class="header">
            <h1>Admin Dashboard</h1>
        </header>

        <aside class="sidebar">
            <h2>Navigation</h2>
            <nav>
                <a href="#overview">Overview</a>
                <a href="#users">Users</a>
                <a href="#reports">Reports</a>
                <a href="#settings">Settings</a>
            </nav>
        </aside>

        <main class="main" id="overview">
            <h2>Dashboard Overview</h2>

            <section class="cards">
                <article class="card" id="users">
                    <h3>Total Users</h3>
                    <p>1,250 registered users</p>
                </article>

                <article class="card" id="reports">
                    <h3>Reports</h3>
                    <p>48 reports generated</p>
                </article>

                <article class="card wide">
                    <h3>Recent Activity</h3>
                    <p>New users joined and recent reports were updated.</p>
                </article>

                <article class="card" id="settings">
                    <h3>Pending Tasks</h3>
                    <p>8 tasks require attention.</p>
                </article>
            </section>
        </main>
    </div>
</body>
</html>
