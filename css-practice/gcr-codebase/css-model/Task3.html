
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gradient Backgrounds</title>
    <link rel="stylesheet" href="Task3.css">
</head>
<body>
    <header class="fixed-header">
        <h1>CSS Gradient Showcase</h1>
    </header>

    <main>
        <section class="gradient linear">
            <h2>Linear Gradient</h2>
            <p>A smooth blend of colors moving in a straight direction.</p>
        </section>

        <section class="gradient radial">
            <h2>Radial Gradient</h2>
            <p>Colors spread outward from a central point.</p>
        </section>
    </main>

    <footer class="fixed-footer">
        Gradient Background Practice
    </footer>
</body>
</html>
