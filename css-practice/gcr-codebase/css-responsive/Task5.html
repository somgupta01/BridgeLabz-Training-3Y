
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Filter Cards Animation</title>
    <link rel="stylesheet" href="Task5.css">
</head>
<body>
    <header>
        <h1>Our Team</h1>
        <p>Hover over a profile to see the image effect.</p>
    </header>

    <main class="profile-container">
        <article class="profile-card">
            <img src="https://images.unsplash.com/photo-1500648767791-00dcc994a43e?auto=format&fit=crop&w=600&q=80" alt="Alex, web developer">
            <div class="profile-info">
                <h2>Alex Morgan</h2>
                <p>Web Developer</p>
                <p>Builds responsive digital experiences.</p>
            </div>
        </article>

        <article class="profile-card">
            <img src="https://images.unsplash.com/photo-1494790108377-be9c29b29330?auto=format&fit=crop&w=600&q=80" alt="Jordan, designer">
            <div class="profile-info">
                <h2>Jordan Lee</h2>
                <p>UI Designer</p>
                <p>Creates clear and engaging interfaces.</p>
            </div>
        </article>

        <article class="profile-card">
            <img src="https://images.unsplash.com/photo-1506794778202-cad84cf45f1d?auto=format&fit=crop&w=600&q=80" alt="Sam, data analyst">
            <div class="profile-info">
                <h2>Sam Taylor</h2>
                <p>Data Analyst</p>
                <p>Finds useful patterns in data.</p>
            </div>
        </article>
    </main>

    <footer>Meet Our Team</footer>
</body>
</html>
