
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Filter Comparison Layout</title>
    <link rel="stylesheet" href="Task8.css">
</head>
<body>
    <header>
        <h1>Image Filter Comparison</h1>
        <p>Compare the original image with a filtered version.</p>
    </header>

    <main class="comparison">
        <figure class="comparison-item">
            <img src="https://images.unsplash.com/photo-1500530855697-b586d89ba3ee?auto=format&fit=crop&w=900&q=80" alt="Original mountain landscape">
            <figcaption>Before: Original Image</figcaption>
        </figure>

        <figure class="comparison-item">
            <img class="filtered-image" src="https://images.unsplash.com/photo-1500530855697-b586d89ba3ee?auto=format&fit=crop&w=900&q=80" alt="Filtered mountain landscape">
            <figcaption>After: Brightness Filter</figcaption>
        </figure>
    </main>

    <footer>CSS Filter Comparison</footer>
</body>
</html>
