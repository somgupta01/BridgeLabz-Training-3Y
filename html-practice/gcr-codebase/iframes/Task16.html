
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>URI Encoding</title>
</head>
<body>
    <h1>URI Encoding Example</h1>

    <p>Original query: HTML &amp; CSS</p>

    <p>Correctly encoded URL:</p>

    <a href="https://example.com/search?query=HTML%20%26%20CSS">
        Search HTML and CSS
    </a>

    <p>
        %20 represents a space, and %26 represents an ampersand
        inside the query value.
    </p>
</body>
</html>
