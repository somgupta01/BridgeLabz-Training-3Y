
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Outline and Focus Form</title>
    <link rel="stylesheet" href="Task9.css">
</head>
<body>
    <header>
        <h1>Contact Form</h1>
        <p>Click each field to see its focus outline.</p>
    </header>

    <main>
        <form class="contact-form" action="#" method="get">
            <h2>Send a Message</h2>

            <label for="name">Full Name</label>
            <input type="text" id="name" name="name"
                   placeholder="Enter your name" required>

            <label for="email">Email Address</label>
            <input type="email" id="email" name="email"
                   placeholder="Enter your email" required>

            <label for="message">Message</label>
            <textarea id="message" name="message" rows="5"
                      placeholder="Write your message" required></textarea>

            <button type="submit">Submit</button>
        </form>
    </main>

    <footer>Outline and Focus Styling Practice</footer>
</body>
</html>
