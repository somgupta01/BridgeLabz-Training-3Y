
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Travel Selection</title>
</head>
<body>
    <header>
        <h1>Choose Your Travel Preferences</h1>
    </header>

    <main>
        <form action="#">
            <p>
                <label for="country">Country:</label>
                <select id="country" name="country">
                    <option selected>India</option>
                    <option>Japan</option>
                    <option>France</option>
                </select>
            </p>

            <p>
                <label for="state">State:</label>
                <select id="state" name="state">
                    <option selected>Uttar Pradesh</option>
                    <option>Rajasthan</option>
                    <option>Goa</option>
                </select>
            </p>

            <p>
                <label for="city">City:</label>
                <select id="city" name="city">
                    <option selected>Mathura</option>
                    <option>Jaipur</option>
                    <option>Panaji</option>
                </select>
            </p>

            <p>
                <label for="place">Favorite Tourist Place:</label>
                <select id="place" name="place">
                    <option selected>Prem Mandir</option>
                    <option>Taj Mahal</option>
                    <option>Amber Fort</option>
                </select>
            </p>

            <button type="submit">Submit</button>
        </form>

        <section>
            <h2>Summary of Your Choices</h2>
            <p>You selected India, Uttar Pradesh, Mathura,
               and Prem Mandir as your travel preferences.</p>
        </section>
    </main>

    <footer>
        <p>&copy; 2026 Travel Selection</p>
    </footer>
</body>
</html>
