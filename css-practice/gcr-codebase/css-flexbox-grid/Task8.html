
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Responsive Gallery</title>
    <link rel="stylesheet" href="Task8.css">
</head>
<body>
    <header>
        <h1>Travel Photo Gallery</h1>
    </header>

    <main class="gallery">
        <figure>
            <img src="https://placehold.co/400x300?text=Mountains" alt="Mountains">
            <figcaption>Beautiful Mountains</figcaption>
        </figure>

        <figure>
            <img src="https://placehold.co/400x300?text=Beach" alt="Beach">
            <figcaption>Sunny Beach</figcaption>
        </figure>

        <figure>
            <img src="https://placehold.co/400x300?text=Forest" alt="Forest">
            <figcaption>Green Forest</figcaption>
        </figure>

        <figure>
            <img src="https://placehold.co/400x300?text=Waterfall" alt="Waterfall">
            <figcaption>Peaceful Waterfall</figcaption>
        </figure>

        <figure>
            <img src="https://placehold.co/400x300?text=Desert" alt="Desert">
            <figcaption>Golden Desert</figcaption>
        </figure>

        <figure>
            <img src="https://placehold.co/400x300?text=City" alt="City">
            <figcaption>Modern City</figcaption>
        </figure>
    </main>
</body>
</html>
