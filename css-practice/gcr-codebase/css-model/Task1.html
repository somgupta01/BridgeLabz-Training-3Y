
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Borders and Padding</title>
    <link rel="stylesheet" href="Task1.css">
</head>
<body>
    <header>
        <h1>Borders and Padding</h1>
        <p>Explore different border styles and spacing.</p>
    </header>

    <main class="container">
        <section class="box solid">
            <h2>Solid Border</h2>
            <p>Padding: 10px</p>
        </section>
        <section class="box dashed">
            <h2>Dashed Border</h2>
            <p>Padding: 20px</p>
        </section>
        <section class="box double">
            <h2>Double Border</h2>
            <p>Padding: 15px</p>
        </section>
        <section class="box groove">
            <h2>Groove Border</h2>
            <p>Padding: 25px</p>
        </section>
        <section class="box rounded">
            <h2>Rounded Corners</h2>
            <p>Border radius: 25px</p>
        </section>
    </main>

    <footer>CSS Border and Padding Practice</footer>
</body>
</html>
