
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard</title>
    <link rel="stylesheet" href="Task8.css">
</head>
<body>
    <header class="topbar">
        <h1>My Dashboard</h1>
        <p>Welcome, Som!</p>
    </header>

    <div class="layout">
        <aside class="sidebar">
            <h2>Menu</h2>
            <nav>
                <a href="#overview">Overview</a>
                <a href="#projects">Projects</a>
                <a href="#tasks">Tasks</a>
                <a href="#settings">Settings</a>
            </nav>
        </aside>

        <main class="content" id="overview">
            <h2>Dashboard Overview</h2>

            <section class="boxes">
                <article class="box" id="projects">
                    <h3>Total Projects</h3>
                    <p class="number">12</p>
                    <p>Projects created so far.</p>
                </article>

                <article class="box" id="tasks">
                    <h3>Pending Tasks</h3>
                    <p class="number">5</p>
                    <p>Tasks waiting for completion.</p>
                </article>

                <article class="box" id="settings">
                    <h3>Completed Tasks</h3>
                    <p class="number">24</p>
                    <p>Tasks completed successfully.</p>
                </article>
            </section>
        </main>
    </div>
</body>
</html>
