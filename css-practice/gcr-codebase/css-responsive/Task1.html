
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Responsive Image Filter Gallery</title>
    <link rel="stylesheet" href="Task1.css">
</head>
<body>
    <header>
        <h1>Image Filter Gallery</h1>
        <p>Hover over an image to remove its filter.</p>
    </header>

    <main class="gallery">
        <figure class="gallery-item">
            <img class="blur" src="https://images.unsplash.com/photo-1500530855697-b586d89ba3ee?auto=format&fit=crop&w=700&q=80" alt="Mountain landscape">
            <figcaption>Blur Filter</figcaption>
        </figure>

        <figure class="gallery-item">
            <img class="grayscale" src="https://images.unsplash.com/photo-1470770841072-f978cf4d019e?auto=format&fit=crop&w=700&q=80" alt="Lake and mountains">
            <figcaption>Grayscale Filter</figcaption>
        </figure>

        <figure class="gallery-item">
            <img class="sepia" src="https://images.unsplash.com/photo-1441974231531-c6227db76b6e?auto=format&fit=crop&w=700&q=80" alt="Green forest">
            <figcaption>Sepia Filter</figcaption>
        </figure>

        <figure class="gallery-item">
            <img class="brightness" src="https://images.unsplash.com/photo-1507525428034-b723cf961d3e?auto=format&fit=crop&w=700&q=80" alt="Sunny beach">
            <figcaption>Brightness Filter</figcaption>
        </figure>

        <figure class="gallery-item">
            <img class="contrast" src="https://images.unsplash.com/photo-1464822759023-fed622ff2c3b?auto=format&fit=crop&w=700&q=80" alt="Snowy mountains">
            <figcaption>Contrast Filter</figcaption>
        </figure>

        <figure class="gallery-item">
            <img class="hue" src="https://images.unsplash.com/photo-1511818966892-d7d671e672a2?auto=format&fit=crop&w=700&q=80" alt="Modern building">
            <figcaption>Hue-Rotate Filter</figcaption>
        </figure>
    </main>

    <footer>Responsive CSS Gallery</footer>
</body>
</html>
