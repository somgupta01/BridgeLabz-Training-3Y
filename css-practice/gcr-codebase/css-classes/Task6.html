
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CSS Animation Demo</title>
    <link rel="stylesheet" href="Task6.css">
</head>
<body>
    <header>
        <h1>CSS Animation Showcase</h1>
        <p>Explore moving, bouncing, and color-changing elements.</p>
    </header>

    <main class="animation-container">
        <section class="animation-card">
            <h2>Moving Box</h2>
            <div class="moving-box"></div>
            <p>Moves from left to right.</p>
        </section>

        <section class="animation-card">
            <h2>Bouncing Ball</h2>
            <div class="ball"></div>
            <p>Bounces continuously.</p>
        </section>

        <section class="animation-card">
            <h2>Color Changing</h2>
            <p class="color-text">CSS Animation</p>
            <p>Changes text color repeatedly.</p>
        </section>
    </main>

    <footer>CSS Keyframes Practice</footer>
</body>
</html>
