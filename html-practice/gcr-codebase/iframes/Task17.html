
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Submit Form</title>
</head>
<body>
    <h1>Simple Form</h1>

    <form action="result.html" method="get" target="resultFrame">
        <label for="name">Enter Your Name:</label>
        <input type="text" id="name" name="name" required>

        <button type="submit">Submit</button>
    </form>

    <!-- The result page loads inside this iframe after submission. -->
    <iframe
        src="about:blank"
        name="resultFrame"
        title="Submission Result"
        width="500"
        height="150">
    </iframe>
</body>
</html>
