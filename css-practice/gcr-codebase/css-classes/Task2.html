
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CSS Tooltip Demo</title>
    <link rel="stylesheet" href="Task2.css">
</head>
<body>
    <header>
        <h1>CSS Tooltip Showcase</h1>
        <p>Hover over each item to see its tooltip.</p>
    </header>

    <main class="tooltip-container">
        <section class="tooltip-item">
            <span class="tooltip-target">Home</span>
            <span class="tooltip-text">Go to the home page</span>
        </section>

        <section class="tooltip-item">
            <span class="tooltip-target">Profile</span>
            <span class="tooltip-text">View your profile</span>
        </section>

        <section class="tooltip-item">
            <span class="tooltip-target">Settings</span>
            <span class="tooltip-text">Manage your settings</span>
        </section>

        <section class="tooltip-item">
            <span class="tooltip-target">Help</span>
            <span class="tooltip-text">Get help and support</span>
        </section>
    </main>

    <footer>Tooltips created with CSS only</footer>
</body>
</html>
