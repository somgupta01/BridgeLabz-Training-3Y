
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Card Flip Animation</title>
    <link rel="stylesheet" href="Task9.css">
</head>
<body>
    <main class="container">
        <h1>Discover Web Development</h1>

        <div class="card">
            <div class="card-inner">
                <section class="card-front">
                    <img src="https://placehold.co/300x200?text=Web+Development"
                         alt="Web development">
                    <h2>Web Development</h2>
                    <p>Hover over this card to learn more.</p>
                </section>

                <section class="card-back">
                    <h2>About Web Development</h2>
                    <p>Web development involves creating websites
                       using HTML, CSS, and programming technologies.
                       HTML structures content, while CSS styles it.</p>
                </section>
            </div>
        </div>
    </main>
</body>
</html>
